server:
  port: ${VULNSCOPE_SERVER_PORT:19081}

spring:
  application:
    name: vulnscope-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${VULNSCOPE_DB_HOST:127.0.0.1}:${VULNSCOPE_DB_PORT:3306}/${VULNSCOPE_DB_NAME:vulnscope}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${VULNSCOPE_DB_USER:vulnscope}
    password: ${VULNSCOPE_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt-secret: ${VULNSCOPE_JWT_SECRET:}
  jwt-expiration-minutes: 720
  admin-password: ${VULNSCOPE_ADMIN_PASSWORD:}
  cors-origins: ${VULNSCOPE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  spark:
    enabled: ${VULNSCOPE_SPARK_SUBMIT_ENABLED:false}
    ssh-host: ${VULNSCOPE_SSH_HOST:127.0.0.1}
    ssh-port: ${VULNSCOPE_SSH_PORT:22}
    ssh-username: ${VULNSCOPE_SSH_USERNAME:spark}
    ssh-password: ${VULNSCOPE_SSH_PASSWORD:}
    spark-submit-path: ${VULNSCOPE_SPARK_SUBMIT_PATH:/opt/spark/bin/spark-submit}
    hdfs-command-path: ${VULNSCOPE_HDFS_COMMAND_PATH:/opt/hadoop/bin/hdfs}
    local-jar-path: ${VULNSCOPE_SPARK_LOCAL_JAR:../spark-job/target/vulnscope-spark-job.jar}
    remote-jar-path: ${VULNSCOPE_SPARK_REMOTE_JAR:/opt/vulnscope/vulnscope-spark-job.jar}
    input-path: ${VULNSCOPE_SPARK_INPUT:hdfs:///vulnscope/input/vulnerabilities.jsonl}
    output-root: ${VULNSCOPE_SPARK_OUTPUT_ROOT:hdfs:///vulnscope/output-ui}
    jdbc-url: ${VULNSCOPE_SPARK_JDBC_URL:jdbc:mysql://127.0.0.1:3306/vulnscope?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    jdbc-user: ${VULNSCOPE_SPARK_JDBC_USER:${VULNSCOPE_DB_USER:vulnscope}}
    jdbc-password: ${VULNSCOPE_SPARK_JDBC_PASSWORD:${VULNSCOPE_DB_PASSWORD:}}
    timeout-minutes: ${VULNSCOPE_SPARK_TIMEOUT_MINUTES:20}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vulnscope: INFO
