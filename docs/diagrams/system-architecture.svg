<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb0c6"/></marker></defs><text x="60" y="64" font-family="Microsoft YaHei,Arial,sans-serif" font-size="34" font-weight="800" fill="#182033" text-anchor="start">VulnScope 系统总体技术架构</text><text x="60" y="98" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">浏览器、Java 服务、Spark 集群与双存储协同</text><line x1="60" y1="120" x2="1340" y2="120" stroke="#182033" stroke-width="2"/><rect x="120" y="150" width="1160" height="110" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="120" y="150" width="1160" height="48" rx="16" fill="#2563eb"/><rect x="120" y="180" width="1160" height="18" fill="#2563eb"/><text x="138" y="183" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">表现层</text><text x="138" y="232" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#182033" text-anchor="start">Vue 3、Pinia、Vue Router、Axios、ECharts</text><text x="138" y="262" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">用户门户、六维态势大屏、管理员工作台</text><line x1="700" y1="260" x2="700" y2="290" stroke="#9fb0c6" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="295" width="1160" height="110" rx="16" fill="#ffffff" stroke="#e11d48" stroke-width="3"/><rect x="120" y="295" width="1160" height="48" rx="16" fill="#e11d48"/><rect x="120" y="325" width="1160" height="18" fill="#e11d48"/><text x="138" y="328" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">接口与安全层</text><text x="138" y="377" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#182033" text-anchor="start">Spring Boot 3、REST API、OpenAPI 3</text><text x="138" y="407" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">JWT 身份认证、BCrypt 密码、双角色鉴权</text><line x1="700" y1="405" x2="700" y2="435" stroke="#9fb0c6" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="440" width="1160" height="110" rx="16" fill="#ffffff" stroke="#0f9f8f" stroke-width="3"/><rect x="120" y="440" width="1160" height="48" rx="16" fill="#0f9f8f"/><rect x="120" y="470" width="1160" height="18" fill="#0f9f8f"/><text x="138" y="473" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">业务服务层</text><text x="138" y="522" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#182033" text-anchor="start">漏洞目录、Maven 依赖扫描、任务与用户治理</text><text x="138" y="552" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">21 个接口路径，统一响应与异常处理</text><line x1="700" y1="550" x2="700" y2="580" stroke="#9fb0c6" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="585" width="1160" height="110" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="120" y="585" width="1160" height="48" rx="16" fill="#d97706"/><rect x="120" y="615" width="1160" height="18" fill="#d97706"/><text x="138" y="618" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">分布式计算层</text><text x="138" y="667" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#182033" text-anchor="start">Spark 2.4.5 on YARN</text><text x="138" y="697" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">node1、node2、node3 并行计算 D1 至 D6</text><line x1="700" y1="695" x2="700" y2="725" stroke="#9fb0c6" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="730" width="1160" height="110" rx="16" fill="#ffffff" stroke="#182033" stroke-width="3"/><rect x="120" y="730" width="1160" height="48" rx="16" fill="#182033"/><rect x="120" y="760" width="1160" height="18" fill="#182033"/><text x="138" y="763" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">数据存储层</text><text x="138" y="812" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#182033" text-anchor="start">HDFS 原始数据与结果目录、Windows MySQL</text><text x="138" y="842" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">7065 条漏洞、8553 条组件关系、6 张结果表</text></svg>